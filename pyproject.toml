[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "text-to-sql-agent"
version = "0.1.0"
description = "Secure, schema-aware text-to-SQL agent for SQLite"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
text-to-sql = "text_to_sql_agent.__main__:main"

[tool.setuptools.packages.find]
include = ["text_to_sql_agent*"]
